<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <clipPath id="field">
      <circle cx="64" cy="64" r="52"/>
    </clipPath>
  </defs>

  <!-- мягкий акцентный ореол -->
  <circle cx="64" cy="64" r="60" fill="#e0e9ff"/>

  <!-- круглое поле зрения -->
  <circle cx="64" cy="64" r="52" fill="#1b1c1f"/>

  <g clip-path="url(#field)">
    <!-- зерна шлифа -->
    <polygon points="20,30 52,18 58,50 30,62" fill="#3b6ea5" opacity="0.55"/>
    <polygon points="58,20 96,26 100,58 62,52" fill="#5b8f7a" opacity="0.45"/>
    <polygon points="26,62 58,52 64,86 34,96" fill="#8a7a4a" opacity="0.50"/>
